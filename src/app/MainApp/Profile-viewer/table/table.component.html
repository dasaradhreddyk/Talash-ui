<section class="results-section">
  <header class="results-header">
    <h2>Search Results for {{ searchword }}</h2>
  </header>

  <div class="results-grid">
    <app-table-row-mixed
      *ngFor="let b of BookMarks | async"
      [bookmark]="b"
      [columns]="columns"
    ></app-table-row-mixed>

    <app-table-row
      *ngFor="let ch of characters | async"
      [character]="ch"
      [url]="url"
      [columns]="columns"
    ></app-table-row>

    <app-table-row
      *ngFor="let ch2 of characters2 | async"
      [character]="ch2"
      [url]="url"
      [columns]="columns"
    ></app-table-row>
  </div>
</section>
