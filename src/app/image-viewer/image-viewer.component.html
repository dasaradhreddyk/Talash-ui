 <div   style="height:250px" >
      <my-video [searchword]="searchwords1" [landing]="true" [type]="type"></my-video>                          
 </div>                      
  <br><br><br>
<ul class="image-list no-bullets">
    <li class="image-card" *ngFor="let item of imageCompleteDetails">
      <img class="responsive" [src]="item.url" alt="Image preview" />
      <div class="image-toolbar">
        <span class="toolbar-group">
          <span class="toolbar-icon">♥</span>
          <span class="toolbar-text">{{item.likes}}</span>
        </span>
        <div class="image-actions">
          <button type="button" class="toolbar-button toolbar-share" aria-label="Share">
            <span class="toolbar-only-icon">🔗</span>
          </button>
          <button type="button" class="toolbar-button toolbar-like" aria-label="Like" (click)="UpdateLikes(item.url)">
            <span class="toolbar-only-icon">❤️</span>
          </button>
          <a class="toolbar-button toolbar-download" aria-label="Download" [href]="item.url" target="_blank" rel="noreferrer">
            <span class="toolbar-only-icon">⬇️</span>
          </a>
        </div>
      </div>
    </li>
</ul>
